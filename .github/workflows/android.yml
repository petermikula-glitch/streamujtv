# Sestaví aplikaci pro Android TV a na hlavní větvi ji vydá: vydání app-v<verze> s přílohou APK.
# Aplikace se na tato vydání sama ptá a nabídne aktualizaci. Nová verze = zvýšit versionCode
# a versionName v android/app/build.gradle.kts a popsat změny v android/RELEASE_NOTES.md.
name: Android aplikace

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - 'plugin.video.prehrajto.mojevidea/resources/lib/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testy logiky
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider tests

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Aktualizace jde nainstalovat jen se stejným podpisem jako předchozí verze.
      # Klíč je v tajné proměnné SIGNING_KEYSTORE_BASE64, případně v android/signing/.
      - name: Podpisový klíč
        id: key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          elif [ -f android/signing/mojevidea.keystore ]; then
            echo "path=$GITHUB_WORKSPACE/android/signing/mojevidea.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Podpisový klíč není nastavený – aplikace se sestaví, ale nevydá."
          fi

      - name: Sestavení
        working-directory: android
        env:
          KEYSTORE: ${{ steps.key.outputs.path }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            gradle --no-daemon assembleDebug -PsigningKeystore="$KEYSTORE" -PsigningPassword="${SIGNING_PASSWORD:-android}"
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verze
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MojeVidea-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Vydání
        if: github.ref == 'refs/heads/main' && steps.key.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          tag="app-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Vydání $tag už existuje – pro nové vydání zvyšte verzi."
            exit 0
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "MojeVidea-$VERSION.apk"
          gh release create "$tag" "MojeVidea-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "Moje videa $VERSION" --notes-file android/RELEASE_NOTES.md
