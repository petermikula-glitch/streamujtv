# Rychlá kontrola každé změny: testy logiky a shoda Kodi repozitáře se zdroji.
# Běží u pull requestů i u větví asistentů, aby se chyba našla dřív, než se dostane do main.
name: Testy

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Testy
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider tests

      - name: Kodi repozitář odpovídá zdrojům
        run: python tools/build_zip.py --check
