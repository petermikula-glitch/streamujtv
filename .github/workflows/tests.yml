# Pojistka: testy logiky. Hlavní kontrola se dělá před odesláním
# (AGENTS.md), tady jen u pull requestu do main a po sloučení – a po sloučení se znovu nekontroluje
# obsah, který už prošel v pull requestu. Pravidla šetření minut: CLAUDE.md.
name: Testy

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read
  actions: read

concurrency:
  group: testy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Po sloučení: stejný strom souborů už prošel v pull requestu → zbytek se přeskočí.
      - name: Už ověřeno v pull requestu?
        id: known
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "verified=$(bash .github/scripts/overeno-v-pr.sh tests.yml)" >> "$GITHUB_OUTPUT"

      # Obě verze Pythonu v jedné úloze: každá úloha se účtuje nejméně jednou minutou.
      - uses: actions/setup-python@v5
        if: steps.known.outputs.verified != 'true'
        with:
          python-version: |
            3.13
            3.11

      - name: Testy (Python 3.11 a 3.13)
        if: steps.known.outputs.verified != 'true'
        run: |
          for python in python3.11 python3.13; do
            "$python" -m pip install --quiet pytest
            "$python" -m pytest -q -p no:cacheprovider tests
          done
