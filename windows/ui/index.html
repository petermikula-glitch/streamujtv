<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promítárna</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="ui/assets/icon.png">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="back" class="f orb" title="Zpět (Esc)" aria-label="Zpět" hidden><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="search" class="f orb" title="Hledat (/)" aria-label="Hledat"><img src="ui/assets/ic_tile_search.svg" alt=""></button>
    <button id="profile" class="f chip" title="Kdo se dívá"><img id="avatar" alt=""><span id="who"></span></button>
    <nav id="side"></nav>
    <div id="brand"><img src="ui/assets/logo.png" alt="Promítárna"></div>
  </header>
  <div id="crumbs"></div>
  <main id="screen" tabindex="-1"></main>
</div>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<script>window.TOKEN = "__TOKEN__";</script>
<script src="ui/app.js"></script>
</body>
</html>
